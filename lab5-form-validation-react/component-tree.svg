<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 400" font-family="Arial,sans-serif" font-size="13">
  <defs><marker id="a" markerWidth="8" markerHeight="8" refX="7" refY="4" orient="auto"><path d="M0,0 L8,4 L0,8 z" fill="#333"/></marker></defs>
  <rect width="800" height="400" fill="#fff"/>
  <text x="400" y="24" text-anchor="middle" font-size="18" font-weight="bold">Lab 5 - Component Tree</text>
  <rect x="340" y="40" width="120" height="40" rx="8" fill="#dbeafe" stroke="#2563eb"/><text x="400" y="65" text-anchor="middle" font-weight="bold">App (tab)</text>
  <rect x="120" y="130" width="140" height="44" rx="8" fill="#dcfce7" stroke="#16a34a"/><text x="190" y="150" text-anchor="middle" font-weight="bold">LoginForm</text><text x="190" y="166" text-anchor="middle" font-size="11">state: values, touched</text>
  <rect x="540" y="130" width="140" height="44" rx="8" fill="#dcfce7" stroke="#16a34a"/><text x="610" y="150" text-anchor="middle" font-weight="bold">Wizard</text><text x="610" y="166" text-anchor="middle" font-size="11">state: step, data, errors</text>
  <rect x="20" y="250" width="110" height="40" rx="8" fill="#fef3c7" stroke="#d97706"/><text x="75" y="275" text-anchor="middle">FormField</text>
  <rect x="145" y="250" width="150" height="40" rx="8" fill="#fef3c7" stroke="#d97706"/><text x="220" y="275" text-anchor="middle">PasswordStrength</text>
  <rect x="440" y="250" width="100" height="40" rx="8" fill="#fef3c7" stroke="#d97706"/><text x="490" y="275" text-anchor="middle">StepAccount</text>
  <rect x="555" y="250" width="100" height="40" rx="8" fill="#fef3c7" stroke="#d97706"/><text x="605" y="275" text-anchor="middle">StepProfile</text>
  <rect x="670" y="250" width="110" height="40" rx="8" fill="#fef3c7" stroke="#d97706"/><text x="725" y="275" text-anchor="middle">StepReview</text>
  <line x1="380" y1="80" x2="210" y2="128" stroke="#333" marker-end="url(#a)"/>
  <line x1="420" y1="80" x2="590" y2="128" stroke="#333" marker-end="url(#a)"/>
  <line x1="165" y1="174" x2="85" y2="248" stroke="#333" marker-end="url(#a)"/>
  <line x1="205" y1="174" x2="220" y2="248" stroke="#333" marker-end="url(#a)"/>
  <line x1="580" y1="174" x2="495" y2="248" stroke="#333" marker-end="url(#a)"/>
  <line x1="610" y1="174" x2="605" y2="248" stroke="#333" marker-end="url(#a)"/>
  <line x1="640" y1="174" x2="720" y2="248" stroke="#333" marker-end="url(#a)"/>
  <text x="40" y="340" font-size="12">StepAccount also uses FormField + PasswordStrength. Validation rules live in validators.js (regex).</text>
  <text x="40" y="360" font-size="12">Wizard passes data, errors, onChange as props to each step; data is kept in Wizard until final submit.</text>
